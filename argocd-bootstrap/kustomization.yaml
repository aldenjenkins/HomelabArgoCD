resources:
  - argocd
  - applicationset.yaml
  - appproject.yaml
generators:
  - sopsgenerator.yaml
patches:
  - path: patches/custom-cmd-params-cm.yaml
  - path: patches/custom-rbac-cm.yaml
  - path: patches/custom-cm.yaml
  - path: patches/custom-notifications-cm.yaml
  - path: patches/custom-repo-server-deployment.yaml
  # - path: patches/custom-server-deployment.yaml
replacements:
  - source:
      kind: Secret
      name: slack-token
      namespace: argocd
      fieldPath: stringData
    targets:
      - select:
          kind: Secret
          name: argocd-notifications-secret
          namespace: argocd
        fieldPaths:
          - stringData
