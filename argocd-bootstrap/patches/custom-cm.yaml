apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  accounts.alden: login
  accounts.readonly: apiKey
  kustomize.buildOptions: "--enable-alpha-plugins --enable-exec"
  # 2026-05-13 argocd dex authproxy type now includes federation
  # which breaks the authproxy connector which used to work,
  # so switching to authelia oidc (sad face).
  # dex.config: |
  #   connectors:
  #     - type: 'authproxy'
  #       id: authelia
  #       name: Authelia
  #       config:
  #         userHeader: "Remote-User"
  #         redirectURI: "https://argocd.home.alden.ai/auth/callback"
  oidc.config: |
    name: Authelia
    issuer: https://auth.home.alden.ai
    clientID: argocd
    clientSecret: $authelia-oidc-secret:oidc.authelia.clientSecret
    cliClientID: argocd-cli
    requestedScopes:
      - openid
      - email
      - groups
    enableUserInfoGroups: true
    userInfoPath: /api/oidc/userinfo
  url: https://argocd.home.alden.ai
  resource.customizations.health.grafana.integreatly.org_GrafanaFolder: |
    -- Reference CRD can be found here:
    -- https://grafana.github.io/grafana-operator/docs/api/#grafanafolder

    function getStatusFromConditions(obj, hs)
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for i, condition in ipairs(obj.status.conditions) do
          if condition.status ~= nil then
            if hs.message ~= "" then
              hs.message = hs.message .. ", "
            end
            if condition.reason ~= nil then
              hs.message = hs.message .. condition.reason
              if condition.type ~= nil then
                hs.message = hs.message .. " for " .. condition.type
                if condition.message ~= nil then
                  hs.message = hs.message .. " because " .. condition.message
                end
              end
            end

            -- FolderUIDMismatch is a negative-polarity condition: False means
            -- the UIDs are consistent, not that the resource is unhealthy.
            if condition.status == "True" and condition.type == "FolderUIDMismatch" then
              hs.status = "Degraded"
              return hs
            end

            if condition.status == "False" and condition.type ~= "FolderUIDMismatch" then
              hs.status = "Degraded"
              return hs
            end

            if condition.status == "True" then
              hs.status = "Healthy"
            end
          end
        end
      end
      return hs
    end

    local hs = {}
    hs.status = "Progressing"
    hs.message = ""
    hs = getStatusFromConditions(obj, hs)
    return hs
