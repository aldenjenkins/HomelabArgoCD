apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/aldenjenkins/HomelabArgoCD.git
        revision: HEAD
        directories:
          - path: 'apps/*'
  syncPolicy:
    preserveResourcesOnDeletion: true  # <- Prevents resource deletion when app is removed
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: "alertmanager"
    spec:
      project: apps
      source:
        repoURL: https://github.com/aldenjenkins/HomelabArgoCD.git
        targetRevision: HEAD
        path: 'apps/{{.path.basename}}'
      destination:
        server: https://kubernetes.default.svc
      # syncPolicy:
      #   automated:
      #     prune: true
      #     selfHeal: false
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: istio-validator-istio-system
          jsonPointers:
            - /webhooks/0/failurePolicy
            - /metadata/labels
        - group: "apps"
          kind: Deployment
          name: redis-operator-redis-operator
          jsonPointers:
            - /spec/template/spec/serviceAccount
      syncPolicy:
        syncOptions:
          - ServerSideApply=true    # <-- removes the last-applied-configuration annotation from resources
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: operators
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/aldenjenkins/HomelabArgoCD.git
        revision: HEAD
        directories:
          - path: 'operators/*'
  syncPolicy:
    preserveResourcesOnDeletion: true  # <- Prevents resource deletion when app is removed
  template:
    metadata:
      name: '{{.path.basename}}'
      annotations:
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: "alertmanager"
    spec:
      project: operators
      source:
        repoURL: https://github.com/aldenjenkins/HomelabArgoCD.git
        targetRevision: HEAD
        path: 'operators/{{.path.basename}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        syncOptions:
          - ServerSideApply=true    # <-- handles CRDs cleanly
      # syncPolicy:
      #   automated:
      #     prune: true
      #     selfHeal: false
