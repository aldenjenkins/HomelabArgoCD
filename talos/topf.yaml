talosVersion: v1.14.1
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.36.4

clusterName: homelab-live
clusterEndpoint: https://192.168.123.50:6443

secretsPath: secrets.sops.yaml

patchesDir: patches

nodes:
  ### CONTROL PLANE NODES SECTION (First in list so that "talhelp gencommand upgrade" will attempt upgrading control plane nodes first) ###
  - host: control-plane-01
    ip: 192.168.123.141
    role: control-plane
    schematicId: '@patches/schematics/control-plane.yaml'
    data:
      macAddr: 88:ae:dd:74:ad:d1
      installDiskPath: /dev/nvme1n1
      longhornDiskSelector: '!system_disk'
      longhornDiskMinSize: 1000GiB
      longhornDiskMaxSize: 1000GiB
      localPathDiskSelector: '!system_disk'
      localPathDiskMinSize: 2500GiB
      localPathDiskMaxSize: 2500GiB
