resources:
  # renovate: datasource=github-releases depName=kubebao/openbao-operator
  - github.com/kubebao/openbao-operator/config/overlays/single-tenant?ref=0.7.0
  # - https://github.com/kubebao/openbao-operator/releases/download/0.7.0/install.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
images:
- name: example.com/openbao-operator
  newName: ghcr.io/kubebao/openbao-operator
  newTag: 0.6.3
patches:
  - target:
      kind: Deployment
      name: openbao-operator-controller
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: openbao-operator-controller
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                - name: OPERATOR_VERSION
                  value: 0.6.3
                - name: OPERATOR_UPGRADE_IMAGE
                  value: ghcr.io/kubebao/openbao-upgrade:0.6.3@sha256:0e776f90bd52da7172de4177c9b3bf09fb8e647f7ee882052cf18349fc4adea2
