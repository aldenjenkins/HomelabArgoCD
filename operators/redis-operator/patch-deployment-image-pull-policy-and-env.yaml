apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-operator-redis-operator
  namespace: redis-operator-system
spec:
  template:
    spec:
      containers:
      - name: manager
        imagePullPolicy: IfNotPresent
        args:
        - --leader-elect
        - --zap-log-level=info
        - --enable-webhooks=false
