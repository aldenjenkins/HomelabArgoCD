resources:
  # renovate: datasource=github-releases depName=open-telemetry/opentelemetry-operator
  - https://github.com/open-telemetry/opentelemetry-operator/releases/download/v0.159.0/opentelemetry-operator.yaml
  - servicemonitor.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
patches:
  - target:
      kind: Deployment
      name: opentelemetry-operator-controller-manager
    #
    # Note: 2026-01-18
    # Disabling the go instrumentation for now as i dont care to use it atm, just doesnt seem useful for anything currently.
    #
    # patch: |-
    #   - op: add
    #     path: /spec/template/spec/containers/0/args/-
    #     value: "--enable-go-instrumentation"
    #
    # note: 2026-01-18
    # This is to enable to the mtls required for allowing targetallocator to use secrets for ServiceMonitors and PodMonitors such as for my external minio metrics auth.
    # 2026-06-11 new 0.153.0 version includes targetallocator.mtls by default, so removing it here
    # patch: |-
    #   - op: add
    #     path: /spec/template/spec/containers/0/args/-
    #     value: "--feature-gates=operator.targetallocator.mtls"
    # note: 2026-08-18
    # the 0.158.0 operator version enables the beta operator.networkpolicy and operand.networkpolicy objects by default, and we don't want that because cilium conflicts with them.
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--feature-gates=-operator.networkpolicy"
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "--feature-gates=-operand.networkpolicy"
