apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-secrets-openbao
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: cloudflare-secrets-openbao
  dataFrom:
    - extract:
        key: homelab-live/cert-manager/cloudflare-secrets
