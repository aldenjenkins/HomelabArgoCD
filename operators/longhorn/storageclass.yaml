apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-local
provisioner: driver.longhorn.io
parameters:
  fsType: ext4
  numberOfReplicas: "1"
  dataLocality: strict-local
  staleReplicaTimeout: "30"
  recurringJobSelector: '[
    {
    "name":"skipbackup",
    "isGroup":true
    }
    ]'
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-kafka
provisioner: driver.longhorn.io
parameters:
  numberOfReplicas: "1"
  dataLocality: strict-local
  staleReplicaTimeout: "30"
  recurringJobSelector: '[
    {
    "name":"skipbackup",
    "isGroup":true
    }
    ]'
