apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - forgejo.home.alden.ai
  rules:
  - backendRefs:
    - name: forgejo
      port: 3000
    matches:
    - path:
        type: PathPrefix
        value: /
