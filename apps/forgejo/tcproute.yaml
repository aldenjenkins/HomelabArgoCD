apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forgejo-ssh
spec:
  parentRefs:
  - name: default-https-gateway
    namespace: istio-system
    sectionName: forgejo-ssh  # References the listener name
    group: gateway.networking.k8s.io
    kind: Gateway
  rules:
  - backendRefs:
    - name: forgejo-ssh
      port: 22
      group: ''
      kind: Service
      weight: 1
