apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homebox-httproute
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://homebox.home.alden.ai"
    gethomepage.dev/description: Home Organization Inventory
    gethomepage.dev/group: Home
    gethomepage.dev/icon: homebox.svg
    gethomepage.dev/app: homebox # optional, may be needed if app.kubernetes.io/name != ingress metadata.name
    gethomepage.dev/name: homebox
    gethomepage.dev/pod-selector: app.kubernetes.io/name=homebox
spec:
  parentRefs:
  - name: default-https-gateway
    namespace: istio-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - homebox.home.alden.ai
  rules:
  - backendRefs:
    - name: homebox
      port: 7745
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
