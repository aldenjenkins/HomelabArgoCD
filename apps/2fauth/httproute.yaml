apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: 2fauth-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - 2fauth.home.alden.ai
  rules:
  - backendRefs:
    - name: svc-2fauth
      port: 8000
    matches:
    - path:
        type: PathPrefix
        value: /
