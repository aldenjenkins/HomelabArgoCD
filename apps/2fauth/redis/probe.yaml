apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: 2fauth-tcp-30s
spec:
  jobName: 2fauth-tcp-30s
  interval: 30s
  scrapeTimeout: 30s
  module: tcp_connect
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local.:19115
  targets:
    staticConfig:
      static:
        - twofauth-redis.2fauth.svc.cluster.local.:6379
