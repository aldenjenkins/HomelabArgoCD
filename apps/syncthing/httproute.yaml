apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing-nas-httproute
spec:
  parentRefs:
  - name: default-https-gateway
    namespace: istio-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - syncthing.home.alden.ai
  rules:
  - backendRefs:
    - name: syncthing-nas
      port: 8384
    # matches:
    # - path:
    #     type: PathPrefix
    #     value: /
      group: ''
      kind: Service
      weight: 1
