apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencost-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - opencost.home.alden.ai
  rules:
  - backendRefs:
    - name: opencost
      port: 9090
    matches:
    - path:
        type: PathPrefix
        value: /
