apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pyroscope-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - pyroscope.home.alden.ai
  rules:
  - backendRefs:
    - name: pyroscope
      port: 4040
    matches:
    - path:
        type: PathPrefix
        value: /
