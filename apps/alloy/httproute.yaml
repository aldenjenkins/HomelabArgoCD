apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alloy-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - alloy.home.alden.ai
  rules:
  - backendRefs:
    - name: alloy-profiles
      port: 12345
    matches:
    - path:
        type: PathPrefix
        value: /
