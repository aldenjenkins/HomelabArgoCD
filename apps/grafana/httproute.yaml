apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - grafana.home.alden.ai
  rules:
  - backendRefs:
    - name: grafana-service
      port: 3000
    matches:
    - path:
        type: PathPrefix
        value: /
