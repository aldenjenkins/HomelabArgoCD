apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: ec2
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  resyncPeriod: 5m
  datasources:
    - inputName: "DS_CLOUDWATCH"
      datasourceName: "cloudwatch"
  folderUID: ec2-uid
  url: https://grafana.com/api/dashboards/11265/revisions/2/download
