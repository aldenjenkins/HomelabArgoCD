apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: mimir-alertmanager
  namespace: mimir
spec:
  allowCrossNamespaceImport: true
  datasource:
    name: mimir-alertmanager
    uid: mimirAlertmanager
    type: alertmanager
    access: proxy
    url: http://mimir-gateway.mimir.svc.cluster.local:80
    isDefault: false
    jsonData:
      handleGrafanaManagedAlerts: true
      implementation: mimir
      tlsSkipVerify: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
