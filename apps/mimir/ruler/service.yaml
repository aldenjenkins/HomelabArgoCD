apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: ruler
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: mimir
  name: mimir-ruler
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 8080
      targetPort: http-metrics
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: grpc
      protocol: TCP
    - name: memberlist
      port: 7946
      targetPort: memberlist
      protocol: TCP
  selector:
    app.kubernetes.io/component: ruler
    app.kubernetes.io/instance: mimir-ruler
    app.kubernetes.io/name: mimir-ruler
