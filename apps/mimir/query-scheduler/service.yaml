# Headless service for query-scheduler discovery
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: query-scheduler
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: mimir
    prometheus.io/service-monitor: "false"
  name: mimir-query-scheduler-headless
  namespace: mimir
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
    - name: memberlist
      port: 7946
      targetPort: 7946
      protocol: TCP
  selector:
    app.kubernetes.io/component: query-scheduler
    app.kubernetes.io/instance: mimir-query-scheduler
    app.kubernetes.io/name: mimir-query-scheduler
---
# Regular service for load-balanced access
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: query-scheduler
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: mimir
  name: mimir-query-scheduler
  namespace: mimir
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
    - name: memberlist
      port: 7946
      targetPort: 7946
      protocol: TCP
  selector:
    app.kubernetes.io/component: query-scheduler
    app.kubernetes.io/instance: mimir-query-scheduler
    app.kubernetes.io/name: mimir-query-scheduler
