apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: distributor
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/name: mimir
    app.kubernetes.io/part-of: mimir
  name: mimir-distributor
  namespace: mimir
spec:
  type: ClusterIP
  ports:
    - name: http-metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: grpc
      port: 9095
      targetPort: 9095
      protocol: TCP
    - name: memberlist
      port: 7946
      targetPort: 7946
      protocol: TCP
  selector:
    app.kubernetes.io/component: distributor
    app.kubernetes.io/instance: mimir-distributor
    app.kubernetes.io/name: mimir-distributor
---
apiVersion: v1
kind: Service
metadata:
  name: mimir-distributor-headless
  namespace: mimir
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/component: distributor
    app.kubernetes.io/part-of: memberlist
    prometheus.io/service-monitor: "false"
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8080
      protocol: TCP
      name: http-metrics
      targetPort: http
    - port: 9095
      protocol: TCP
      name: grpc
      targetPort: grpc
  selector:
    app.kubernetes.io/name: mimir-distributor
    app.kubernetes.io/instance: mimir-distributor
    app.kubernetes.io/component: distributor
