apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: ingester
    app.kubernetes.io/instance: mimir-ingester
    app.kubernetes.io/name: mimir-ingester
    app.kubernetes.io/part-of: mimir
    app.kubernetes.io/version: "3.0.2"
  name: mimir-ingester
spec:
  replicas: 3
  podManagementPolicy: Parallel
  serviceName: mimir-ingester-headless
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/component: ingester
      app.kubernetes.io/instance: mimir-ingester
      app.kubernetes.io/name: mimir-ingester
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ingester
        app.kubernetes.io/instance: mimir-ingester
        app.kubernetes.io/name: mimir-ingester
        app.kubernetes.io/part-of: mimir
        app.kubernetes.io/version: "3.0.2"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - control-plane-01
                      - control-plane-02
                      - control-plane-03
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - mimir-ingester
                  - key: app.kubernetes.io/instance
                    operator: In
                    values:
                      - mimir-ingester
              namespaces:
                - mimir
              topologyKey: kubernetes.io/hostname
      containers:
        - name: ingester
          image: grafana/mimir:3.0.4
          imagePullPolicy: IfNotPresent
          args:
            - -target=ingester
            - -config.file=/etc/mimir/mimir.yaml
            - -config.expand-env=true
            # Ingester-specific overrides
            - -ingester.ring.instance-availability-zone=$(POD_NAME)
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://trace-collector.observability.svc.cluster.local:4318
            - name: OTEL_TRACES_SAMPLER
              value: always_on
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mimir-objectstorage
                  key: s3-access-key
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: mimir-objectstorage
                  key: s3-secret-key
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9095
              name: grpc
              protocol: TCP
            - containerPort: 7946
              name: memberlist
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 1
            failureThreshold: 8
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 20
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /etc/mimir
              readOnly: true
            - name: data
              mountPath: /data
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: mimir-ingester
      terminationGracePeriodSeconds: 300
      volumes:
        - name: config
          configMap:
            name: mimir-config
  volumeClaimTemplates:
    - metadata:
        labels:
          app.kubernetes.io/component: ingester
          app.kubernetes.io/instance: mimir-ingester
          app.kubernetes.io/name: mimir-ingester
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 50Gi
