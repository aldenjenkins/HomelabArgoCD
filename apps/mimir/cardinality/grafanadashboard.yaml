                  },
                  {
                    "id": "displayName",
                    "value": "Metric"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "series_count"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "No. of series"
