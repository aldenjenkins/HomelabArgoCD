                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "label_values_count"
                },
                "properties": [
                  {
                    "id": "displayName",
                    "value": "No. of unique values"
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "percentage"
                },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 26,
            "w": 10,
            "x": 14,
            "y": 6
          },
          "id": 8,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "enablePagination": true,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": []
          },
          "pluginVersion": "12.0.1",
          "targets": [
            {
              "cacheDurationSeconds": 0,
              "datasource": {
                "type": "marcusolsson-json-datasource",
                "uid": "cardinality"
              },
              "fields": [
                {
                  "jsonPath": "$.cardinality[*].label_name",
                  "language": "jsonpath",
                  "name": "Label"
                },
                {
                  "jsonPath": "$.cardinality[*].label_values_count",
                  "language": "jsonpath",
                  "name": "label_values_count"
                },
                {
                  "jsonPath": "$map(cardinality,function($v)\n{ \n    $v.label_values_count/$sum(cardinality[*].label_values_count)\n})",
                  "language": "jsonata",
                  "name": "Percentage"
                }
              ],
              "headers": [
                [
                  "X-Scope-OrgID",
                  "${tenant}"
                ]
              ],
              "method": "GET",
              "params": [
                [
                  "label_names[]",
                  "__name__"
                ],
                [
                  "limit",
                  "100"
                ]
              ],
              "queryParams": "",
              "refId": "A",
              "urlPath": "/label_names"
            }
          ],
          "title": "Top labels by value count",
          "type": "table"
        }
