# Mimir runtime configuration
# This file can be updated without restarting Mimir components
# Changes are picked up every 10 seconds (configurable in runtime_config.period)

# Per-tenant overrides (useful for testing different limits)
overrides:
  # anonymous tenant (when multitenancy is disabled)
  anonymous:
    # Per-tenant ingestion rate limit in samples per second.
    # CLI flag: -distributor.ingestion-rate-limit
    ingestion_rate: 100000 # default = 10000
    # Per-tenant allowed ingestion burst size (in number of samples).
    # CLI flag: -distributor.ingestion-burst-size
    ingestion_burst_size: 200000 # default 200000
    # The maximum number of in-memory series per tenant, across the cluster before
    # replication. 0 to disable.
    # CLI flag: -ingester.max-global-series-per-user
    max_global_series_per_user: 5000000 # default = 150000
    native_histograms_ingestion_enabled: true
    # Maximum number of buckets per native histogram sample. 0 to disable the limit.
    # CLI flag: -validation.max-native-histogram-buckets
    max_native_histogram_buckets: 160 # default = 0
