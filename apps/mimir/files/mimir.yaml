# Grafana Mimir configuration for microservices mode
# This config is shared by all components - each component reads only the sections it needs

# Target is set per-component via CLI flag -target=<component>

# Multi-tenancy configuration
multitenancy_enabled: false

# Limits configuration
limits:
  # Ingestion rate limits
  ingestion_rate: 100000
  ingestion_burst_size: 200000
  # Max series per user/tenant
  max_global_series_per_user: 5000000
  max_global_series_per_metric: 100000
  # Query limits
  max_fetched_series_per_query: 100000
  # max_fetched_chunk_bytes_per_query: 2147483648  # 2GB
  max_fetched_chunk_bytes_per_query: 2000000  # default
  # Compactor
  compactor_blocks_retention_period: 1y
  # Out-of-order
  out_of_order_time_window: 30m
  # Ruler limits
  ruler_max_rules_per_rule_group: 50
  ruler_max_rule_groups_per_tenant: 100
  # Limit queries to 500 days. You can override this on a per-tenant basis.
  max_total_query_length: 90d
  # Adjust max query parallelism to 16x sharding, without sharding we can run 15d queries fully in parallel.
  # With sharding we can further shard each day another 16 times. 15 days * 16 shards = 240 subqueries.
  max_query_parallelism: 240
  # Avoid caching results newer than 10m because some samples can be delayed
  # This presents caching incomplete results
  max_cache_freshness: 10m
  cardinality_analysis_enabled: true
  query_ingesters_within: &query_ingesters_within 4h  # *query_store_after + 1

ingester_client:
  grpc_client_config:
    max_recv_msg_size: &max_recv_msg_size 419430400
    max_send_msg_size: &max_send_msg_size 419430400

# Distributor configuration
distributor:
  # pool:
  #   health_check_ingesters: true
  # Increase the default remote write timeout (applied to writing to Kafka too) because writing to Kafka-compatible backend may be slower than writing directly to ingesters.
  remote_timeout: 5s
  ring:
    heartbeat_period: 1m
    heartbeat_timeout: 4m
    kvstore:
      store: memberlist

# Ingester configuration
ingester:
  ring:
    replication_factor: 2
    kvstore:
      store: memberlist
    heartbeat_period: 2m
    heartbeat_timeout: 10m
    tokens_file_path: /data/tokens
    num_tokens: 512
    unregister_on_shutdown: false
    # How long to keep data in memory before flushing to storage
    # Longer = better compression, shorter = faster availability in store-gateway

ingest_storage:
  enabled: true
  kafka:
    address: mimir-kafka.mimir.svc.cluster.local.:9092
    auto_create_topic_default_partitions: 100
    auto_create_topic_enabled: true
    topic: mimir-ingest

# Querier configuration
querier:
  # Query ingesters for recent data and store-gateway for historical
  # query_store_after: 12h
  query_store_after: &query_store_after 3h
  max_concurrent: 16  # Default 20
  timeout: &timeout 2m

# Server configuration
server:
  http_listen_port: 8080
  grpc_listen_port: 9095
  log_level: info
  log_format: logfmt
  grpc_server_max_recv_msg_size: *max_send_msg_size
  grpc_server_max_send_msg_size: *max_recv_msg_size
  http_server_read_timeout: *timeout
  http_server_write_timeout: *timeout

# Query frontend configuration
frontend:
  log_queries_longer_than: 10s
  parallelize_shardable_queries: true
  cache_results: true
  results_cache:
    backend: memcached
    memcached:
      addresses: dnssrvnoa+mimir-memcached-headless.mimir.svc.cluster.local.:11211
      timeout: 500ms
      max_item_size: 5242880  # 5MB max item size for query results
    compression: snappy
  # Connect to query-scheduler instead of embedding the queue
  scheduler_address: mimir-query-scheduler-headless.mimir.svc.cluster.local.:9095
  split_queries_by_interval: 6h
  query_sharding_target_series_per_shard: 2500
  scheduler_worker_concurrency: 5
  grpc_client_config:
    max_recv_msg_size: *max_recv_msg_size
    max_send_msg_size: *max_send_msg_size

# Frontend worker - queriers connect to query-scheduler
frontend_worker:
  # When using query-scheduler, queriers connect to scheduler, not frontend
  scheduler_address: mimir-query-scheduler-headless.mimir.svc.cluster.local.:9095
  grpc_client_config:
    max_send_msg_size: *max_send_msg_size
  query_scheduler_grpc_client_config:
    max_recv_msg_size: *max_recv_msg_size
    max_send_msg_size: *max_send_msg_size

# Query scheduler - enables query queuing and fair scheduling
query_scheduler:
  # Increase from default of 100 to account for queries created by query sharding
  max_outstanding_requests_per_tenant: 800
  grpc_client_config:
    max_recv_msg_size: *max_recv_msg_size
    max_send_msg_size: *max_send_msg_size

# Ruler configuration
ruler:
  external_url: https://mimir.home.alden.ai/alertmanager
  enable_api: true
  # alertmanager_url: dnssrvnoa+http://_web._tcp.alertmanager-operated.alertmanager.svc.cluster.local.
  alertmanager_url: dnssrvnoa+http://_http-metrics._tcp.mimir-alertmanager-headless.mimir.svc.cluster.local./alertmanager
  query_frontend:
    address: dns:///mimir-query-frontend.mimir.svc.cluster.local.:9095
    grpc_client_config:
      max_recv_msg_size: *max_recv_msg_size
      max_send_msg_size: *max_send_msg_size
  ring:
    num_tokens: 512
    kvstore:
      store: memberlist
  rule_path: /data/rules

# Compactor configuration
compactor:
  data_dir: /data/compactor
  sharding_ring:
    kvstore:
      store: memberlist
  # Time before a block marked for deletion is deleted from bucket
  deletion_delay: 2h  # default valu from helm chart's templated manifest. normal default it 12h
  # Block ranges for compaction
  block_ranges:
    - 2h
    - 12h
    - 24h

# Store gateway configuration
store_gateway:
  sharding_ring:
    replication_factor: 2
    kvstore:
      store: memberlist
    heartbeat_period: 1m
    heartbeat_timeout: 10m
    tokens_file_path: /data/tokens
    unregister_on_shutdown: false
    wait_stability_min_duration: 1m

# Blocks storage configuration (S3-compatible object storage)
blocks_storage:
  backend: s3
  s3:
    endpoint: minio.minio.svc.cluster.local:9000
    bucket_name: mimir-blocks
    access_key_id: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_KEY}
    insecure: true
  bucket_store:
    sync_dir: /data/tsdb-sync
    ignore_blocks_within: 2h # *query_store_after - 1
    # Index cache configuration - using embedded memcached sidecar
    index_cache:
      backend: memcached
      memcached:
        addresses: dnssrvnoa+mimir-memcached-headless.mimir.svc.cluster.local.:11211
        timeout: 750ms
        max_item_size: 5242880  # 5MB max item size
        max_idle_connections: 150
    # Chunks cache
    chunks_cache:
      backend: memcached
      memcached:
        addresses: dnssrvnoa+mimir-memcached-headless.mimir.svc.cluster.local.:11211
        timeout: 750ms
        max_item_size: 1048576
        max_idle_connections: 150
    metadata_cache:
      backend: memcached
      tenants_list_ttl: 24h
      tenant_blocks_list_ttl: 5m
      chunks_list_ttl: 24h
      metafile_exists_ttl: 2h
      metafile_doesnt_exist_ttl: 5m
      metafile_content_ttl: 24h
      metafile_max_size_bytes: 1048576
      metafile_attributes_ttl: 168h
      block_index_attributes_ttl: 168h
      bucket_index_content_ttl: 5m
      bucket_index_max_size_bytes: 1048576
      memcached:
        addresses: dnssrvnoa+mimir-memcached-headless.mimir.svc.cluster.local.:11211
        max_item_size: 1048576
        max_idle_connections: 150
  tsdb:
    dir: /data/tsdb
    retention_period: *query_ingesters_within
    ship_interval: 1m  # default
    head_compaction_interval: 15m
    flush_blocks_on_shutdown: true

alertmanager:
  data_dir: /data
  enable_api: true
  external_url: https://mimir.home.alden.ai/alertmanager
  sharding_ring:
    kvstore:
      store: memberlist  # Use memberlist for simpler deployments
    replication_factor: 2
    heartbeat_period: 15s
    heartbeat_timeout: 1m
  # external_url: /alertmanager
  # Fallback configuration if sharding is disabled
  fallback_config_file: /configs/alertmanager_fallback_config.yaml
  # Cluster peers for gossip protocol

  # Fallback configuration if sharding is disabled
  # fallback_config_file: /etc/alertmanager/fallback.yaml

  # State persistence to object storage
  persist_interval: 15m

# Alertmanager storage (using same S3)
alertmanager_storage:
  backend: s3
  s3:
    endpoint: minio.minio.svc.cluster.local:9000
    bucket_name: mimir-alertmanager
    access_key_id: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_KEY}
    insecure: true

# Ruler storage (using same S3)
ruler_storage:
  backend: s3
  s3:
    endpoint: minio.minio.svc.cluster.local:9000
    bucket_name: mimir-ruler
    access_key_id: ${S3_ACCESS_KEY}
    secret_access_key: ${S3_SECRET_KEY}
    insecure: true
  cache:
    backend: memcached
    memcached:
      addresses: dnssrvnoa+mimir-memcached-headless.mimir.svc.cluster.local.:11211
      timeout: 500ms
      max_item_size: 1048576

# Memberlist configuration for component discovery
memberlist:
  abort_if_cluster_join_fails: false  # default
  join_members:
    - dns+mimir-gossip-ring.mimir.svc.cluster.local.:7946
  bind_port: 7946
  gossip_interval: 2s
  compression_enabled: false  # default. might try disabling to reduce cpu usage across pods

# Runtime configuration - allows dynamic updates without restart
runtime_config:
  file: /etc/mimir/runtime.yaml
  period: 10s

# Activity tracker for debugging
activity_tracker:
  filepath: /data/activity.log
  max_entries: 1024

# Usage stats reporting (disable for homelab)
usage_stats:
  enabled: false
