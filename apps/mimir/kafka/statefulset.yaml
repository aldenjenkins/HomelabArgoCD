apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mimir-kafka
  labels:
    app.kubernetes.io/name: mimir
    app.kubernetes.io/instance: mimir
    app.kubernetes.io/component: kafka
    app.kubernetes.io/version: "3.0.2"
spec:
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir
      app.kubernetes.io/instance: mimir
      app.kubernetes.io/component: kafka
  serviceName: mimir-kafka-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir
        app.kubernetes.io/instance: mimir
        app.kubernetes.io/version: "3.0.2"
        app.kubernetes.io/component: kafka
    spec:
      serviceAccountName: mimir-kafka
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: kafka
                  app.kubernetes.io/name: mimir
                  app.kubernetes.io/instance: mimir
              topologyKey: kubernetes.io/hostname
      containers:
        - name: kafka
          image: "apache/kafka-native:4.3.1"
          imagePullPolicy: IfNotPresent
          ports:
            # - containerPort: 7071
            #   name: http-metrics
            #   protocol: TCP
            - containerPort: 9092
              name: kafka
              protocol: TCP
            - containerPort: 9093
              name: controller
              protocol: TCP
          env:
            - name: _POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_CLUSTER_ID
              value: ""
            - name: KAFKA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            # - name: KAFKA_METRIC_REPORTERS
            #   value: "org.apache.kafka.server.metrics.PrometheusReporter"
            # - name: KAFKA_PROMETHEUS_METRICS_REPORTER_PORT
            #   value: "7071"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://$(_POD_NAME).mimir-kafka-headless.mimir.svc.cluster.local.:9092
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@mimir-kafka-0.mimir-kafka-headless.mimir.svc.cluster.local:9093,1@mimir-kafka-1.mimir-kafka-headless.mimir.svc.cluster.local:9093,2@mimir-kafka-2.mimir-kafka-headless.mimir.svc.cluster.local:9093"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "2"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_LOG_RETENTION_HOURS
              # 2026-06-05 reducing log retention length if log is corrupted
              # value: "24"
              value: "14"
            # # Larger batches for throughput (Mimir writes in bulk)
            # - name: KAFKA_LOG_FLUSH_INTERVAL_MESSAGES
            #   value: "10000"
            # - name: KAFKA_LOG_FLUSH_INTERVAL_MS
            #   value: "1000"
            #
            # Segment size — smaller segments = faster retention cleanup
            - name: KAFKA_LOG_SEGMENT_BYTES
              value: "536870912"  # 512MB instead of default 1GB

            # Increase socket buffers for throughput
            - name: KAFKA_SOCKET_SEND_BUFFER_BYTES
              value: "1048576"
            - name: KAFKA_SOCKET_RECEIVE_BUFFER_BYTES
              value: "1048576"
            - name: KAFKA_SOCKET_REQUEST_MAX_BYTES
              value: "104857600"  # 100MB
            - name: KAFKA_REPLICA_FETCH_MAX_BYTES
              value: "10485760"  # 10MB, helps with bursty replication
            - name: KAFKA_REPLICA_LAG_TIME_MAX_MS
              value: "30000"  # how long before a replica is dropped from ISR
            - name: KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE
              value: "false"  # never elect an out-of-sync replica as leader, prevents data loss
            - name: KAFKA_LOG_RETENTION_BYTES
              value: "524288000"  # 500MB per partition

          resources:
            requests:
              cpu: 100m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka
            - name: kafka-config
              mountPath: /opt/kafka/config
            - name: kafka-logs
              mountPath: /opt/kafka/logs
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            tcpSocket:
              port: kafka
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: kafka-config
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: kafka-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: "20Gi"
