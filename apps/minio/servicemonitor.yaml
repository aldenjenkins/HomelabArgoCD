apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio-nas
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/instance: minio-api
    app.kubernetes.io/component: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/instance: minio-api
      app.kubernetes.io/component: api
  endpoints:
    - port: api
      path: /minio/v2/metrics/cluster
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
      bearerTokenSecret:
        key: token
        name: minio-prometheus-token
      relabelings:
        - action: replace
          replacement: 192.168.123.170:9000
          targetLabel: server
  namespaceSelector:
    matchNames:
      - minio
---
