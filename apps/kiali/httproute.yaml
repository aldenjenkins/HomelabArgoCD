apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kiali-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - kiali.home.alden.ai
  rules:
  - backendRefs:
    - name: kiali
      port: 20001
    matches:
    - path:
        type: PathPrefix
        value: /
