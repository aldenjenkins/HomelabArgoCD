apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
    name: it-tools-http-60s
spec:
    jobName: it-tools-http-60s
    interval: 60s
    scrapeTimeout: 60s
    module: http_2xx_60s
    prober:
        url: blackbox-exporter.blackbox-exporter.svc.cluster.local.:19115
    targets:
        staticConfig:
            static:
              - http://it-tools.it-tools.svc.cluster.local.:8080/
