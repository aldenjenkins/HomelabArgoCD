apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
    name: adguard-http-get-static-urls-60s
spec:
    jobName: adguard-http-get-static-urls-60s
    interval: 60s
    scrapeTimeout: 60s
    module: http_2xx_60s
    prober:
        url: blackbox-exporter.blackbox-exporter.svc.cluster.local.:19115
    targets:
        staticConfig:
            static:
                - http://adguard.adguard.svc.cluster.local/login.html
