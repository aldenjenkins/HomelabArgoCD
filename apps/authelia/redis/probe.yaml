apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
    name: authelia-tcp-30s
spec:
    jobName: authelia-tcp-30s
    interval: 30s
    scrapeTimeout: 30s
    module: tcp_connect
    prober:
        url: blackbox-exporter.blackbox-exporter.svc.cluster.local.:19115
    targets:
        staticConfig:
            static:
                - authelia-redis.authelia.svc.cluster.local.:6379
