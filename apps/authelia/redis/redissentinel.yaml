apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisSentinel
metadata:
  name: authelia-redis
spec:
  # Sentinel Cluster Configuration
  # 3 sentinels with quorum of 2 for consensus
  clusterSize: 3
  # Security Context
  podSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL
    readOnlyRootFilesystem: false # Sentinel needs write for state
    runAsNonRoot: true
  redisSentinelConfig:
    redisReplicationName: authelia-redis
    masterGroupName: authelia-redis-master
    redisReplicationPassword:
      secretKeyRef:
        name: authelia-redis-secret
        key: password
    # Redis connection port
    redisPort: "6379"
    # Quorum: Number of sentinels that need to agree for failover
    # With 3 sentinels, quorum of 2 provides fault tolerance
    quorum: "2"
    # # Failover timeout in milliseconds (10 seconds)
    # # Time to wait before considering failover failed
    # failoverTimeout: "10000"
    #
    # # Down-after-milliseconds (5 seconds)
    # # Time after which sentinel considers master down
    # downAfterMilliseconds: "5000"
    downAfterMilliseconds: "30000"   # was 5000 — avoid false-positive failovers
    failoverTimeout: "180000"        # was 10000 — Redis default, gives failover time to complete
    # Parallel syncs during failover
    # Number of replicas that can sync with new master simultaneously
    parallelSyncs: "1"
  kubernetesConfig:
    image: quay.io/opstree/redis-sentinel:v8.6.2
    imagePullPolicy: IfNotPresent
    redisSecret:
      name: authelia-redis-sentinel-secret
      key: password
    resources:
      requests:
        cpu: 101m
        memory: 128Mi
      limits:
        cpu: 101m
        memory: 128Mi
  # Pod Anti-Affinity for HA
  # Ensure sentinel pods are spread across different nodes
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
              - authelia-redis
          topologyKey: kubernetes.io/hostname
  # health checks
  livenessProbe:
    failureThreshold: 3
    initialDelaySeconds: 1
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  readinessProbe:
    failureThreshold: 3
    initialDelaySeconds: 1
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  pdb:
    enabled: true
    maxUnavailable: 1
