apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  labels:
    app: authelia
    component: authelia
    app.kubernetes.io/name: authelia
    app.kubernetes.io/instance: authelia
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authelia
      app.kubernetes.io/instance: authelia
  revisionHistoryLimit: 5
  replicas: 3
  minReadySeconds: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: "100%"
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: authelia
        component: authelia
        app.kubernetes.io/name: authelia
        app.kubernetes.io/instance: authelia
    spec:
      hostNetwork: false
      hostPID: false
      hostIPC: false
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: authelia
                  app.kubernetes.io/instance: authelia
              topologyKey: kubernetes.io/hostname
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: authelia
          image: authelia/authelia:4.39.20
          imagePullPolicy: IfNotPresent
          command: ["authelia"]
          resources:
            requests:
              cpu: 5m
              memory: 150Mi
          envFrom:
            - secretRef:
                name: authelia-secret-env
          env:
            - name: AUTHELIA_SERVER_DISABLE_HEALTHCHECK
              value: "true"
            - name: X_AUTHELIA_CONFIG
              value: '/configuration.yaml'
            - name: X_AUTHELIA_CONFIG_FILTERS
              value: template
            - name: AUTHELIA_STORAGE_POSTGRES_ADDRESS
              value: authelia-postgres-18-rw.authelia.svc.cluster.local:5432
            - name: AUTHELIA_STORAGE_POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  key: dbname
                  name: authelia-postgres-18-app
            - name: AUTHELIA_STORAGE_POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authelia-postgres-18-app
                  key: username
            - name: AUTHELIA_STORAGE_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authelia-postgres-18-app
                  key: password
          startupProbe:
            failureThreshold: 6
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 3
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          livenessProbe:
            failureThreshold: 5
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 5
          readinessProbe:
            failureThreshold: 5
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 5
            successThreshold: 1
            timeoutSeconds: 5
          ports:
            - name: http-metrics
              containerPort: 9959
              protocol: TCP
            - name: http
              containerPort: 9091
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - mountPath: /configuration.yaml
              name: authelia-config
              subPath: configuration.yaml
            - mountPath: /secrets
              name: authelia-secret-files
              readOnly: true
      volumes:
        - name: authelia-config
          configMap:
            name: authelia-config
        - name: authelia-secret-files
          projected:
            defaultMode: 0400
            sources:
              # Existing Authelia secret files.
              # This preserves your current /secrets/<key> files.
              - secret:
                  name: authelia-secret-files
              # Redis data-node password:
              # becomes /secrets/redis/password
              - secret:
                  name: authelia-redis-secret
                  items:
                    - key: password
                      path: redis/password
              # Redis Sentinel password:
              # becomes /secrets/redis/ha-password
              - secret:
                  name: authelia-redis-sentinel-secret
                  items:
                    - key: password
                      path: redis/ha-password
      automountServiceAccountToken: false
