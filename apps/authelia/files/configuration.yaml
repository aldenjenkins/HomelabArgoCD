# yaml-language-server: $schema=https://www.authelia.com/schemas/v4.39/json-schema/configuration.json
theme: dark
default_2fa_method: webauthn
server:
  address: tcp://0.0.0.0:9091/
  asset_path: ""
  # NOTE: Disabled due to read-only filesystem, see:
  # https://www.authelia.com/configuration/miscellaneous/server/#disable_healthcheck
  disable_healthcheck: true
  headers:
    csp_template: ""
  buffers:
    read: 4096
    write: 4096
  timeouts:
    read: 6 seconds
    write: 6 seconds
    idle: 30 seconds
  endpoints:
    enable_pprof: false
    enable_expvars: false
    authz:
      # auth-request:
      #   implementation: AuthRequest
      ext-authz:
        implementation: ExtAuthz
      # forward-auth:
      #   implementation: ForwardAuth
log:
  level: debug
  format: json
  file_path: ""
  keep_stdout: true
telemetry:
  metrics:
    enabled: true
definitions:
  user_attributes:
    vaultwarden_roles:
      expression: '"vaultwarden_admins" in groups ? ["admin"] : "vaultwarden_users" in groups ? ["user"] : [""]'
identity_validation:
  elevated_session:
    code_lifespan: 5 minutes
    elevation_lifespan: 10 minutes
    characters: 8
    require_second_factor: false
    skip_second_factor: false
  reset_password:
    jwt_lifespan: 5 minutes
    jwt_algorithm: HS256
    # jwt_secret: replaced by env var
identity_providers:
  oidc:
    # Replace with a strong secret
    # hmac_secret: replaced by env var
    claims_policies:
      vaultwarden:
        id_token:
          - vaultwarden_roles
        custom_claims:
          vaultwarden_roles: {}
      forgejo:
        custom_claims:
          sshpubkey: {}
    scopes:
      vaultwarden:
        claims:
          - vaultwarden_roles
      forgejo:
        claims:
          - sshpubkey
    jwks:
      - key_id: example
        algorithm: RS256
        use: sig
        key: |
          {{- fileContent "/secrets/oidc_tls.key" | nindent 10 }}
    lifespans:
      id_token: 1h
      access_token: 1h
      refresh_token: 90m
      authorize_code: 1m
    enable_client_debug_messages: false
    cors:
      endpoints:
        - authorization
        - token
        - revocation
        - introspection
        - userinfo
      allowed_origins:
        # Replace with your application domain
        - http://app.localhost
      # This will automatically allow origins from redirect URIs
      allowed_origins_from_client_redirect_uris: true
    clients:
      - client_id: nats-text-analysis
        client_name: NATS Text Analysis Dashboard
        # Replace with a strong client secret
        client_secret: '{{ fileContent "/secrets/oidc-client-nats-text-analysis" }}'
        # Set to true for public clients, false for confidential clients
        public: false
        token_endpoint_auth_method: client_secret_post
        authorization_policy: one_factor
        redirect_uris:
          # Replace with your callback URL
          - http://app.localhost/callback.html
        scopes:
          - openid
          - profile
          - email
        grant_types:
          - refresh_token
          # - authorization_code
        response_types:
          - code
        response_modes:
          - form_post
          - query
        userinfo_signed_response_alg: none
      - client_id: outline
        client_name: Outline WIKI
        # Replace with a strong client secret
        client_secret: '{{ fileContent "/secrets/oidc-client-outline" }}'
        # Set to true for public clients, false for confidential clients
        public: false
        require_pkce: false
        pkce_challenge_method: ""
        authorization_policy: one_factor
        redirect_uris:
          # Replace with your callback URL
          - https://outline.home.alden.ai/auth/oidc.callback
        scopes:
          - openid
          - profile
          - email
          - offline_access
        grant_types:
          - refresh_token
          - authorization_code
        response_types:
          - code
        # response_modes:
        #   - form_post
        #   - query
        userinfo_signed_response_alg: none
        access_token_signed_response_alg: none
        token_endpoint_auth_method: client_secret_post
      - client_id: vaultwarden
        client_name: Vaultwarden
        client_secret: '{{ fileContent "/secrets/oidc-client-vaultwarden" }}'
        public: false
        # authorization_policy: two_factor
        authorization_policy: one_factor
        require_pkce: true
        pkce_challenge_method: S256
        claims_policy: vaultwarden
        redirect_uris:
          - https://vaultwarden.home.alden.ai/identity/connect/oidc-signin
        scopes:
          - openid
          - offline_access
          - profile
          - email
          - vaultwarden
        response_types:
          - code
        grant_types:
          - authorization_code
          - refresh_token
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
      - client_id: forgejo
        client_name: Forgejo
        claims_policy: forgejo
        # The digest of 'docker run --rm authelia/authelia:latest authelia crypto hash generate pbkdf2 --variant sha512 --random --random.length 72 --random.charset rfc3986'.
        client_secret: '{{ fileContent "/secrets/oidc-client-forgejo" }}'
        public: false
        authorization_policy: one_factor
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://forgejo.home.alden.ai/user/oauth2/authelia/callback
        scopes:
          - openid
          - email
          - profile
          - groups
          - forgejo
        response_types:
          - code
        grant_types:
          - authorization_code
        access_token_signed_response_alg: none
        userinfo_signed_response_alg: none
        token_endpoint_auth_method: client_secret_basic
      - client_id: 'vikunja'
        client_name: 'Vikunja'
        client_secret: '{{ fileContent "/secrets/oidc-client-vikunja" }}'
        public: false
        authorization_policy: 'one_factor'
        require_pkce: false
        pkce_challenge_method: ''
        redirect_uris:
          - 'https://vikunja.home.alden.ai/auth/openid/authelia'
        scopes:
          - 'openid'
          - 'profile'
          - 'email'
        response_types:
          - 'code'
        grant_types:
          - 'authorization_code'
        access_token_signed_response_alg: 'none'
        userinfo_signed_response_alg: 'none'
        token_endpoint_auth_method: 'client_secret_basic'
totp:
  disable: false
  issuer: Authelia
  skew: 1
  secret_size: 32
  algorithm: SHA1
  digits: 6
  period: 30
  allowed_algorithms:
    - SHA1
  allowed_digits:
    - 6
  allowed_periods:
    - 30
webauthn:
  disable: false
  display_name: Authelia
  attestation_conveyance_preference: indirect
  selection_criteria:
    # attachment:
    discoverability: preferred
    user_verification: preferred
  timeout: 60 seconds
ntp:
  address: udp://time.cloudflare.com:123
  version: 4
  max_desync: 3 seconds
  disable_startup_check: false
  disable_failure: false
authentication_backend:
  ldap:
    implementation: lldap
    address: ldap://lldap.lldap.svc.cluster.local
    base_dn: '{{ env "LDAP_BASE_DN" }}'
    user: uid=authelia-bot-user,ou=people,{{ env "LDAP_BASE_DN" }}
    users_filter: (&(objectClass=person)(firstname=*)({username_attribute}={input}))
    groups_filter: (member={dn})
    attributes:
      # NOTE: picture would be great, but it doesn't work;
      # Authelia wants a URL which LDAP doesn't offer, see:
      # - https://github.com/authelia/authelia/blob/8eaf558152bc3e3009e24241fe2f7d6618bb16e4/internal/authentication/ldap_user_provider.go#L218
      # - https://github.com/authelia/authelia/discussions/4812#discussioncomment-4756249
      # picture: avatar
      extra:
        sshpubkey:
          name: sshpubkey
          multi_valued: true
          value_type: string
        immich-quota:
          name: immich_quota
          multi_valued: false
          value_type: integer
  # file:
  #     path: /config/users_database.yml
  #     extra_attributes:
  #         sshpubkey:
  #             multi_valued: true
  #             value_type: string
  password_reset:
    disable: false
    # custom_url: ""
password_policy:
  standard:
    enabled: false
    min_length: 8
    max_length: 0
    require_uppercase: false
    require_lowercase: false
    require_number: false
    require_special: false
  zxcvbn:
    enabled: false
    min_score: 0
session:
  name: authelia_session
  same_site: lax
  inactivity: 30 minutes
  expiration: 1 hour
  remember_me: 7 days
  cookies:
    - domain: home.alden.ai
      authelia_url: https://auth.home.alden.ai
      default_redirection_url: https://homepage.home.alden.ai
      name: authelia_session
  redis:
    host: authelia-redis.authelia.svc.cluster.local
    port: 6379
    # timeout: 5s
    # max_retries: 0
    # maximum_active_connections: 8
    # minimum_idle_connections: 0
regulation:
  max_retries: 3
  find_time: 2 minutes
  ban_time: 5 minutes
notifier:
  disable_startup_check: true
  filesystem:
    filename: /config/notification.txt
access_control:
  default_policy: one_factor
