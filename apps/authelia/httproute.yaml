  # #   namespace: istio-system
  # - kind: Service
  #   name: kanboard
  #   port: 80
  # hostnames:
  # - "kanboard.home.alden.ai"
  rules:
  - backendRefs:
    - name: authelia
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
