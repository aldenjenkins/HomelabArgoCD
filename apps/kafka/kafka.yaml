apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
spec:
  kafka:
    # mimir requires max 4.1 for now
    # https://github.com/grafana/mimir/issues/15319#issuecomment-4520960023
    version: 4.1.0
    # KRaft metadata version
    metadataVersion: "4.1"
    # Enable JMX Prometheus Exporter for metrics
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yaml
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        configuration:
          useServiceDnsDomain: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      # Auto-create topics disabled for production
      auto.create.topics.enable: false
      # Log retention - adjust based on your needs
      log.retention.hours: 14
      # Increase the maximum message size to allow for larger payloads, as required by Mimir 3.1.0-rc.0
      # https://github.com/grafana/mimir/blob/mimir-3.1.0-rc.0/docs/sources/mimir/configure/configure-kafka-backend.md
      message.max.bytes: 16000000
    # Resources managed by KafkaNodePool, not here
  # entityOperator:
  #   topicOperator:
  #     watchedNamespace: "o11y-metrics"
  #     resources:
  #       requests:
  #         memory: 128Mi
  #         cpu: 10m
  #       limits:
  #         memory: 256Mi
  #   userOperator:
  #     watchedNamespace: "o11y-metrics"
  #     resources:
  #       requests:
  #         memory: 128Mi
  #         cpu: 10m
  #       limits:
  #         memory: 256Mi
  kafkaExporter:
    groupRegex: ".*"
    topicRegex: ".*"
    groupExcludeRegex: "^excluded-.*"
    topicExcludeRegex: "^excluded-.*"
  entityOperator:
    topicOperator:
      watchedNamespace: kafka
      reconciliationIntervalMs: 60000
