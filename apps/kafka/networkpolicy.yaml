apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-metrics-scrape-from-otel
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: kafka
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - port: tcp-prometheus   # named port, matches your PodMonitor
    - port: healthcheck      # entity operator metrics
