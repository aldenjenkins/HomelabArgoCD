# kind: HTTPRoute
# metadata:
#   name: dockerregistry-httproute
# spec:
#   parentRefs:
#     - name: default-https-gateway
#       namespace: istio-system
#   hostnames:
#     - registry.home.alden.ai
#   rules:
#   - backendRefs:
#     - name: docker-registry
#       port: 5000
#     matches:
#     - path:
#         type: PathPrefix
#         value: /
# ---
# apiVersion: gateway.networking.k8s.io/v1
# kind: HTTPRoute
# metadata:
#   name: dockerregistry-s3-httproute
# spec:
#   parentRefs:
#     - name: default-https-gateway
#       namespace: istio-system
#   hostnames:
#     - registry-s3.home.alden.ai
#   rules:
#   - backendRefs:
#     - name: docker-registry-s3
#       port: 5000
#     matches:
#     - path:
#         type: PathPrefix
#         value: /
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dockerregistry-httproute
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Infrastructure & Monitoring
    gethomepage.dev/name: Container Registry
    gethomepage.dev/href: "https://registry.home.alden.ai"
    gethomepage.dev/description: Container Image Registry
    gethomepage.dev/icon: docker.svg
    gethomepage.dev/app: registry # optional, may be needed if app.kubernetes.io/name != ingress metadata.name
    gethomepage.dev/pod-selector: app=registry-s3
spec:
  parentRefs:
  - name: default-https-gateway
    namespace: istio-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - registry.home.alden.ai
  rules:
  - backendRefs:
    - name: docker-registry-s3
      port: 5000
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
