apiVersion: apps/v1
kind: Deployment
metadata:
  name: docker-registry-s3
  labels:
    app: registry-s3
  annotations:
    secret.reloader.stakater.com/reload: "registry-env-secret"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: registry-s3
  template:
    metadata:
      labels:
        app: registry-s3
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: registry-s3
      securityContext:
        runAsUser: 45454
        runAsGroup: 45454
        fsGroup: 45454
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: registry
          image: registry:3.1.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/registry
            - serve
            - /etc/docker/registry/config.yml
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 45454
            runAsGroup: 45454
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          envFrom:
            - secretRef:
                name: registry-env-secret
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://trace-collector.observability.svc.cluster.local:4318"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: REGISTRY_LOG_LEVEL
              value: info
          ports:
            - containerPort: 5000
              name: tcp
            - containerPort: 5001
              name: metrics
          volumeMounts:
            - name: registry-config
              mountPath: /etc/docker/registry
      volumes:
        - name: registry-config
          configMap:
            name: docker-registry-config

