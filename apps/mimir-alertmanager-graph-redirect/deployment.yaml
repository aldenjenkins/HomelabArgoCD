apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-alertmanager-graph-redirect
  labels:
    app.kubernetes.io/name: mimir-alertmanager-graph-redirect
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir-alertmanager-graph-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir-alertmanager-graph-redirect
    spec:
      containers:
        - name: mimir-redirect
          image: registry.home.alden.ai/me/mimir-alertmanager-graph-redirect:2.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mimir-redirect
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            initialDelaySeconds: 0
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
