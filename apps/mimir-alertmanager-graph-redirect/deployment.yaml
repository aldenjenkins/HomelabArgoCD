apiVersion: apps/v1
kind: Deployment
metadata:
  name: mimir-alertmanager-graph-redirect
  labels:
    app.kubernetes.io/name: mimir-alertmanager-graph-redirect
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mimir-alertmanager-graph-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mimir-alertmanager-graph-redirect
    spec:
      containers:
        - name: mimir-redirect
          image: registry.home.alden.ai/me/mimir-alertmanager-graph-redirect:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mimir-redirect
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
