apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: opentelemetrycollector-http-30s
spec:
  jobName: opentelemetrycollector-http-30s
  interval: 30s
  module: http_2xx_30s
  scrapeTimeout: 30s
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local.:19115
  targets:
    staticConfig:
      static:
        - http://core-prometheus-collector-extension.observability.svc.cluster.local.:13133
        - http://kubeletstats-collector-extension.observability.svc.cluster.local.:13133
        - http://kubernetes-events-collector-extension.observability.svc.cluster.local.:13133
        - http://logs-agent-collector-extension.observability.svc.cluster.local.:13133
        - http://logs-gateway-collector-extension.observability.svc.cluster.local.:13133
        - http://otlp-collector-extension.observability.svc.cluster.local.:13133
        - http://selfmetrics-collector-extension.observability.svc.cluster.local.:13133
        - http://trace-collector-extension.observability.svc.cluster.local.:13133
