apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
    name: searxng-http-60s
spec:
    jobName: searxng-http-60s
    interval: 60s
    scrapeTimeout: 60s
    module: http_2xx_60s
    prober:
        url: blackbox-exporter.blackbox-exporter.svc.cluster.local.:19115
    targets:
        staticConfig:
            static:
              - http://searxng.searxng.svc.cluster.local.:8080/healthz
