apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tempo-distributor
  labels:
    helm.sh/chart: tempo-distributed-1.52.9
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: tempo
    app.kubernetes.io/component: distributor
    app.kubernetes.io/version: "2.9.0"
    app.kubernetes.io/managed-by: Helm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tempo-distributor
  minReplicas: 2
  # maxReplicas: 5
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          # type: Utilization
          # averageUtilization: 80
          type: AverageValue
          averageValue: 250m
  behavior:
    scaleDown:
      # stabilizationWindowSeconds: 300
      stabilizationWindowSeconds: 600
      policies:
        - type: Percent
          # value: 100
          value: 50
          # periodSeconds: 15
          periodSeconds: 60
    scaleUp:
      # stabilizationWindowSeconds: 0
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          # periodSeconds: 15
          periodSeconds: 60
        - type: Pods
          # value: 4
          value: 2
          # periodSeconds: 15
          periodSeconds: 60
      selectPolicy: Max
