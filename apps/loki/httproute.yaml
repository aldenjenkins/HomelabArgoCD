apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - loki.home.alden.ai
  rules:
  - backendRefs:
    - name: loki-gateway
      port: 80
