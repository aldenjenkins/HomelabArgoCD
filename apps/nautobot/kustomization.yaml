namespace: nautobot
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - postgres
  - redis
  # Comment for runtime, uncomment for init job
  # - init
  # Uncomment for real runtime, comment for init job
  - celery
  - celery-beat
  - server

generators:
  - sopsgenerator.yaml

configMapGenerator:
  - name: nautobot-env-configmap
    envs:
      - files/config.env
    options:
      immutable: true
  - name: nautobot-config-files
    files:
      - files/uwsgi.ini
      - files/nautobot_config.py
    options:
      immutable: true
