apiVersion: apps/v1
kind: Deployment
metadata:
  name: nautobot-celery-beat
  labels:
    app.kubernetes.io/name: nautobot
    helm.sh/chart: nautobot-3.1.1
    app.kubernetes.io/instance: nautobot
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "3.0"
    app.kubernetes.io/component: nautobot-celery-beat
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: nautobot
      app.kubernetes.io/instance: nautobot
      app.kubernetes.io/component: nautobot-celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nautobot
        helm.sh/chart: nautobot-3.1.1
        app.kubernetes.io/instance: nautobot
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "3.0"
        app.kubernetes.io/component: nautobot-celery-beat
    spec:
      serviceAccountName: nautobot

      affinity:
        # podAffinity:

        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: nautobot
                    app.kubernetes.io/name: nautobot
                    app.kubernetes.io/component: nautobot-celery-beat
                topologyKey: kubernetes.io/hostname
              weight: 1
        # nodeAffinity:

      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # initContainers:
      containers:
        - name: nautobot-celery-beat
          tty: true
          # image: ghcr.io/nautobot/nautobot:3.1.2
          image: registry.home.alden.ai/me/nautobot:3.1.2-with-bgp
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
          command:
            - nautobot-server
            - celery
            - beat
            - --loglevel
            - $(NAUTOBOT_LOG_LEVEL)
          env:
            - name: "NAUTOBOT_K8S_COMPONENT"
              value: "nautobot-celery-beat"
            - name: NAUTOBOT_DB_USER
              valueFrom:
                secretKeyRef:
                  name: nautobot-postgres-18-app
                  key: username
            - name: NAUTOBOT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nautobot-postgres-18-app
                  key: password
            - name: NAUTOBOT_DB_HOST
              valueFrom:
                secretKeyRef:
                  name: nautobot-postgres-18-app
                  key: host
            # - name: NAUTOBOT_REDIS_PASSWORD
            #   valueFrom:
            #     secretKeyRef:
            #       name: nautobot-redis
            #       key: redis-password
          envFrom:
            - configMapRef:
                name: nautobot-env-configmap
            - secretRef:
                name: nautobot-env-secret
          resources:
            limits:
              cpu: 2000m
            requests:
              cpu: 5m
              memory: 256M
          livenessProbe:
            exec:
              command:
              - bash
              - -c
              - '[ $(find /tmp/nautobot_celery_beat_heartbeat -mmin -0.1 | wc -l) -eq 1 ] || false'
            failureThreshold: 3
            initialDelaySeconds: 10
            periodSeconds: 60
            successThreshold: 1
            timeoutSeconds: 10
          volumeMounts:
            - name: "git-repos"
              mountPath: "/opt/nautobot/git"
            - name: "nautobot-config-files"
              mountPath: "/opt/nautobot/nautobot_config.py"
              subPath: "nautobot_config.py"
      terminationGracePeriodSeconds: 10
      volumes:
        - name: "git-repos"
          emptyDir: {}
        - name: "nautobot-config-files"
          configMap:
            name: nautobot-config-files
