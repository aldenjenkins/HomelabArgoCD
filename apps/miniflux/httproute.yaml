apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miniflux-httproute
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/href: "https://miniflux.home.alden.ai"
    gethomepage.dev/description: RSS Feed / Newsfeed Browser
    gethomepage.dev/group: Other
    gethomepage.dev/icon: miniflux.svg
    gethomepage.dev/app: miniflux # optional, may be needed if app.kubernetes.io/name != ingress metadata.name
    gethomepage.dev/name: Miniflux
    gethomepage.dev/widget.type: "miniflux"
    gethomepage.dev/widget.url: "http://miniflux-web.miniflux.svc.cluster.local.:80"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_MINIFLUX_API_KEY}}"
    gethomepage.dev/pod-selector: >-
      app.kubernetes.io/name=miniflux,
      app.kubernetes.io/component=web
spec:
  parentRefs:
  - name: default-https-gateway
    namespace: istio-system
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - miniflux.home.alden.ai
  rules:
  - backendRefs:
    - name: miniflux-web
      port: 80
      group: ''
      kind: Service
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
