apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: miniflux-httproute
spec:
  parentRefs:
    - name: default-https-gateway
      namespace: istio-system
  hostnames:
    - miniflux.home.alden.ai
  rules:
  - backendRefs:
    - name: miniflux-web
      port: 80
    matches:
    - path:
        type: PathPrefix
        value: /
