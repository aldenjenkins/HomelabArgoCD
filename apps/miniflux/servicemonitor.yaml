apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: miniflux
  name: miniflux
spec:
  endpoints:
    - path: /metrics
      port: miniflux-http
      interval: 30s
  selector:
    matchLabels:
      app.kubernetes.io/name: miniflux
      app.kubernetes.io/component: web
