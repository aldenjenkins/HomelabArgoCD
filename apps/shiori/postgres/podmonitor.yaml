apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: shiori-postgres-18
  labels:
    app.kubernetes.io/name: postgresql
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: shiori-postgres-18
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
  namespaceSelector:
    matchNames:
      - shiori
